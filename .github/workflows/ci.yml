# One job running the one gate. If `pnpm run ci` passes locally it passes here, because it
# is the same command — see AGENTS.md § Development.
#
# It installs no devbox. The gate should prove the path contributors are told to use, and
# under ADR-0083 that is Node from `.node-version`, corepack, and pnpm; devbox provided
# exactly those two things for whoever wants it, and nothing else this job needs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Generous because the gate scaffolds a Project, installs it from a local registry,
    # builds it and boots it — `tests/a-generated-project-boots.test.ts` allows itself 15
    # minutes on a cold runner, and a job budget below that would kill the run rather than
    # fail the test, which is a far worse signal. #12 added two `docker build`s on top of
    # that, each installing every dependency again inside the container.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      # The one pin, read by `actions/setup-node` here and by fnm, nvm, nodenv, asdf and
      # mise on a contributor's machine. `tests/one-node-version.test.ts` holds it to
      # `engines`, `devbox.json` and both Dockerfiles.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # corepack activates the pnpm pinned in `package.json`, on the Node above. One Node,
      # everywhere — a separately-installed pnpm brings its own and would run every script
      # on it (ADR-0031).
      - run: corepack enable

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The Chromium `tests/the-admin-in-a-browser.test.ts` drives. `pnpm run ci` downloads
      # it itself — the gate needs nothing run before it but the install — so this only
      # decides whether the download happens again on every run. Keyed on the lockfile, which
      # is the same key the pnpm store uses and moves whenever the Playwright version does; it
      # also moves for every other dependency, which costs one extra download and nothing else.
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # The gate installs nothing, so the install is its own step — which is what every
      # other JavaScript repository does and what makes a dependency failure legible as one.
      - run: pnpm install --frozen-lockfile

      # Postgres comes up through the repository's own compose file rather than a service
      # container, so CI runs against the same database a Developer does.
      #
      # One step, not four. A step list here would be a second definition of green that can
      # drift from the composite a contributor runs, and "the same command" is the property
      # worth more than per-step timing (ADR-0083).
      - run: pnpm run ci

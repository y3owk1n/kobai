# One job running the one gate. If `devbox run ci` passes locally it passes here, because
# it is the same command against the same pinned toolchain — see AGENTS.md § Development.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Generous because the gate scaffolds a Project, installs it from a local registry,
    # builds it and boots it — `tests/a-generated-project-boots.test.ts` allows itself 15
    # minutes on a cold runner, and a job budget below that would kill the run rather than
    # fail the test, which is a far worse signal. #12 added two `docker build`s on top of
    # that, each installing every dependency again inside the container.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Postgres comes up through the repository's own compose file rather than a service
      # container, so CI runs against the same database a Developer does.
      - run: devbox run ci

# What Dependabot watches, how often, and how it batches.
#
# Dependabot is switched on in repository settings, so it was already running before this
# file existed — it just ran on its defaults. The result is what #28 audited: six direct
# dependencies sitting behind a major boundary, `typescript` two majors back, while the
# only pull request that had ever arrived was one dev-dependency bump (#15). A caret range
# never crosses a major on its own, and nothing was watching. See #29.
#
# Lines marked DECISION are choices made here. Everything else is either a key Dependabot
# requires, or a default left alone deliberately and said to be one.
#
# ------------------------------------------------------------------------------------
# Version updates and security updates are two mechanisms, and this file reaches only
# one of them directly.
# ------------------------------------------------------------------------------------
# Everything above answers "what should we be on?" — a schedule, a batch, a cooldown.
# Security updates answer a different question, "what are we on that is known
# vulnerable?", and they are **switched on in repository settings**, not here. There is
# no key in this file that enables them; `updates[].applies-to` does not exist, and the
# published schema (json.schemastore.org/dependabot-2.0.json) sets
# `additionalProperties: false` on an update entry, so writing one is a typo that
# Dependabot drops in silence. They were already on while #69's thirteen alerts sat
# open, which is why "enable it" was never the fix.
#
# What this file *does* reach: every option in an entry below marked with the
# shield-check icon in GitHub's options reference also shapes security pull requests.
# Concretely, for the npm entry —
#
#   * `commit-message` applies, so a security PR is a Conventional Commit like any other.
#   * `cooldown` does NOT apply, and `open-pull-requests-limit` does NOT apply. A
#     security fix is therefore never held back by the three-day soak and never crowded
#     out by a backlog of version PRs. That asymmetry is the point of putting the delay
#     in `cooldown` rather than in `schedule`.
#   * `ignore` DOES apply — see the hazard noted on the `ignore` block below.
#   * `groups` applies only where a group says `applies-to: "security-updates"`. A group
#     that omits the key is version-updates-only, which is what the two routine batches
#     below are.
#
# And what neither reaches: an advisory against a **transitive** dependency that no
# release of its parent moves off. Dependabot opens no pull request at all for those —
# it has nothing to bump — so they accumulate silently, which is exactly what #69 found.
# The lever for those is a scoped `pnpm.overrides` entry in the root `package.json`,
# documented there and in AGENTS.md § Dependency updates.

version: 2

updates:
  # ---------------------------------------------------------------------------------
  # npm — the pnpm workspace
  # ---------------------------------------------------------------------------------
  - package-ecosystem: "npm"
    # DECISION: one entry at the workspace root, not one entry per package. kobai is a
    # pnpm workspace (`pnpm-workspace.yaml`: `packages/*`, `reference`) resolved into a
    # single root `pnpm-lock.yaml`. Dependabot's npm fetcher reads `pnpm-workspace.yaml`
    # from this directory, expands those globs against the repository, and fetches each
    # member manifest itself — so `packages/core/package.json`,
    # `packages/plugin-price-log/package.json` and `reference/package.json` are all in
    # scope from here. Listing them separately would run overlapping jobs over the one
    # lockfile they share.
    directory: "/"

    schedule:
      # DECISION: weekly, not daily. A merged bump rewrites `pnpm-lock.yaml`, and every
      # open branch then has to rebase onto it. Work here lands from several branches
      # at once, so one predictable batch a week costs far less churn than a daily
      # trickle — and a week of drift is not the failure this repository actually had.
      interval: "weekly"
      day: "monday"
      # `time` and `timezone` are left at their defaults — a time Dependabot picks, in
      # UTC. The day is what matters here; the hour is not worth a decision.

    # DECISION: raised from the default of 5. The routine batch below is one PR, but each
    # outstanding major gets its own (see `groups`) — at the default limit, a backlog of
    # majors is exactly what gets crowded out, which is the drift #28 found.
    open-pull-requests-limit: 10

    groups:
      # DECISION: one PR for everything routine. Minor and patch across every workspace
      # package, runtime and development alike, so an ordinary week is one branch, one CI
      # run and one review rather than a PR per package.
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

      # DECISION: security fixes batch too, into one PR of their own. `applies-to` is the
      # only key in this file that names security updates, and it belongs to a group; a
      # group without it is version-updates-only, so this batch and the one above never
      # mix. The reason is the same one that made the routine batch weekly: kobai has one
      # `pnpm-lock.yaml` and several branches open against it at once, so N security
      # branches each rewriting that file cost N-1 rebases to land one fix.
      #
      # The obvious objection — that grouping lets one un-bumpable dependency block every
      # other fix — does not hold here, and #69 is the evidence. Dependabot only groups
      # updates it can actually make; an advisory it cannot resolve never joins the group
      # and never blocks it, it simply produces no PR (which is how thirteen alerts went
      # unnoticed). The residual risk is a bump that lands and fails CI, and that is
      # identical grouped or not.
      #
      # It is not hiding anything either, and this is the difference from a major. A major
      # is invisible inside a batch, so #29 kept majors out. A security fix is never only
      # a PR: it has an alert with a severity and an advisory behind it, the alert list is
      # what gets reviewed, and a grouped PR body enumerates every advisory it closes.
      #
      # `dependency-type: "development"` was considered here — batching dev-scope fixes
      # while a runtime one still arrives alone — and rejected on evidence. Every one of
      # #69's thirteen alerts reported `"scope": "runtime"` from the alerts API although
      # all thirteen were reached only through a devDependency, so the predicate would
      # have misfired on the exact case it was written for. Do not add it back without
      # first checking that `gh api repos/y3owk1n/kobai/dependabot/alerts` reports the
      # scope correctly for a transitive pnpm dependency.
      # `update-types` keeps #29's rule intact rather than quietly reversing it: a security
      # fix whose only remedy crosses a **major** boundary matches no group and arrives on
      # its own, exactly as a routine major does. It costs a decision either way — the
      # dependency's API is changing, and the advisory is the reason rather than the
      # excuse. Note the spelling: a group takes `minor`/`patch`, not the
      # `version-update:semver-*` form that `ignore` and `allow` take.
      npm-security:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # DECISION: majors are deliberately left out of every group. A dependency matching no
    # group falls back to its own pull request, so `typescript` 5 → 7 arrives alone, on
    # its own branch, titled with the package and the boundary it crosses, with its own
    # CI run. Folding majors into the routine batch would recreate the failure: one PR
    # nobody reads to the bottom of, going red for a reason that is not obvious, and
    # sitting. A major is meant to cost a decision — this makes it visibly ask for one.

    # DECISION: `@types/node` never crosses a major here. #28 records why: `.node-version`
    # pins Node 22 under ADR-0083, and typing against Node 26's API surface while
    # running Node 22 typechecks code against functions that do not exist at runtime —
    # worse than being behind. Without this, a 22 → 26 PR would arrive every week and be
    # hand-closed every week, which is how a reviewer learns to skim past exactly the
    # kind of PR this file exists to make them read. **Lift this the day `.node-version`
    # moves** — that pin is the constraint, not the types. It is one of five copies of the
    # same major, held together by `tests/one-node-version.test.ts`, so moving it is one
    # change rather than five.
    #
    # HAZARD, and it is the reason to keep this list at two entries and never grow it
    # casually: `ignore` is one of the options that shapes **security** pull requests as
    # well as version ones, and there is no way to scope an entry to version updates
    # only. So a security advisory whose only fix is the major being held back here would
    # be suppressed — no PR, and no way to tell from the alert list that a rule did it.
    # Both entries below are held at a major boundary for a reason recorded elsewhere in
    # the repository, and both name the day to lift them; neither is a preference. Before
    # adding a third, ask what happens when that package is the one with the advisory.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # DECISION: `openapi-typescript` never crosses a major here either, and the reason is
      # the same shape as `@types/node`'s — a pin elsewhere in the repository is the real
      # constraint. Version 7 emits its TypeScript through the **compiler API**, and
      # TypeScript 7 ships none: the import resolves to `undefined` and it dies on
      # `ts.factory` before it reads a byte of `openapi.json`
      # (openapi-ts/openapi-typescript#2841, open; `@hey-api/openapi-ts` fails the same way
      # in hey-api/hey-api#4235). Version 6 emits text and needs no compiler at all, which
      # is why `@kobai/client` pins it exactly. A weekly 6 → 7 PR would be red every week
      # and hand-closed every week. **Lift this the day TypeScript ships an API again and
      # the generator uses it** — expected in 7.1, and a different API, so treat it as a
      # decision rather than a bump. See AGENTS.md § "There is no TypeScript compiler API".
      - dependency-name: "openapi-typescript"
        update-types: ["version-update:semver-major"]

    cooldown:
      # DECISION: hold a release briefly before proposing it, so a version yanked or
      # hot-fixed within days never becomes a PR at all. Security updates ignore cooldown
      # entirely, which is the point of putting the delay here rather than in the
      # schedule.
      #
      # Deliberately flat: no `semver-major-days`. A longer hold on majors is the obvious
      # thing to reach for and it is wrong here — stacked on a Monday-only window it can
      # push a major out by nearly a fortnight, and #29 exists because a major went
      # unnoticed. The update that most needs to surface does not get extra latency. A
      # minor takes `default-days`; `semver-minor-days` is omitted because it would only
      # restate it.
      #
      # `semver-patch-days` was `0` — patches proposed the moment they were published — and
      # that stopped being free when kobai moved to pnpm 11. pnpm now verifies the lockfile
      # against a `minimumReleaseAge` policy at install time and **fails** on any entry
      # published inside the window, so a same-day patch bump would have opened a PR that
      # could not install: red at `pnpm install --frozen-lockfile`, before the gate it was
      # meant to run. Worse, it would go green on its own a day later without a commit,
      # which is the least diagnosable kind of red there is.
      #
      # The rule to keep is one-directional, not an equality: **this soak must never be
      # shorter than pnpm's**, which defaults to 48 hours and is left there on purpose
      # (`pnpm-workspace.yaml` says why — pinning it higher drags every transitive entry
      # backwards). Three days clears 48 hours with room to spare. Lowering `default-days`
      # or putting `semver-patch-days` back to `0` re-opens the failure; raising pnpm's past
      # three days would too, from the other end.
      default-days: 3
      semver-patch-days: 3

    commit-message:
      # DECISION: kobai writes Conventional Commits, and Dependabot otherwise infers the
      # convention from history — #15 happened to infer it correctly, which is luck
      # rather than a guarantee. Stated instead: `chore(deps): …` for runtime
      # dependencies, `chore(deps-dev): …` for development ones.
      prefix: "chore"
      include: "scope"

    # `labels` is left at the default (`dependencies`, plus the ecosystem's own). Marking
    # majors with a custom label was considered and rejected: Dependabot only applies a
    # custom label that already exists in the repository and silently drops one that does
    # not, so the label would have to be created out-of-band in repository settings to do
    # anything — a guarantee this file cannot make on its own. The separate pull request
    # above carries the same signal and is entirely checked in.

  # ---------------------------------------------------------------------------------
  # GitHub Actions — the CI file
  # ---------------------------------------------------------------------------------
  # Nothing watches these today, and a pinned action drifts exactly the way an npm
  # dependency does: `actions/checkout@v4` stays on v4 forever until something asks.
  # ("Workflow" is avoided throughout: CONTEXT.md reserves it for a declared commerce
  # process, and `tests/no-push-script.test.ts` draws the same distinction.)
  - package-ecosystem: "github-actions"
    # Required, and `/` is the only sensible value: for this ecosystem Dependabot reads
    # `.github/workflows/` relative to here, not one directory per file in it.
    directory: "/"

    schedule:
      # Same weekly cadence as npm, for the same reason.
      interval: "weekly"
      day: "monday"

    # `open-pull-requests-limit` is left at the default of 5 here, unlike npm above, and
    # the difference is deliberate rather than an oversight: `.github/workflows/` pins
    # three actions in total, so every one of them can go major in the same week and
    # still fit. Raise it if the number of pinned actions ever passes five.

    groups:
      # DECISION: same shape as npm. Routine action bumps batch into one PR; a major —
      # `actions/checkout@v4` → `@v5` — is left ungrouped and arrives on its own.
      #
      # Note that `jetify-com/devbox-install-action` is on a 0.x version, where a
      # breaking change is a minor by semver and so lands in this batch. That is
      # tolerable here and nowhere else: the gate runs on the pull request that proposes
      # it, so a devbox action that breaks the toolchain install fails its own PR.
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

      # No `applies-to: "security-updates"` group here, unlike npm, and the asymmetry is
      # deliberate. Grouping security fixes there buys one rebase of `pnpm-lock.yaml`
      # instead of several; an action bump edits a `uses:` line and there is no shared
      # file to rebase, so grouping would buy nothing and would cost the per-advisory
      # pull request. Three actions are pinned in total.

    commit-message:
      # DECISION: `ci`, not `chore` — what changes here is the build, not a dependency
      # of the product.
      prefix: "ci"

    # No `cooldown` here, and the asymmetry with npm is deliberate. Cooldown buys time
    # for a bad release to be yanked before it reaches a PR; an action tag is republished
    # rather than yanked, and the gate itself runs on the PR that proposes the bump, so
    # the soak buys nothing an action bump does not already get for free.

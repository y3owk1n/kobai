# What Dependabot watches, how often, and how it batches.
#
# Dependabot is switched on in repository settings, so it was already running before this
# file existed — it just ran on its defaults. The result is what #28 audited: six direct
# dependencies sitting behind a major boundary, `typescript` two majors back, while the
# only pull request that had ever arrived was one dev-dependency bump (#15). A caret range
# never crosses a major on its own, and nothing was watching. See #29.
#
# Lines marked DECISION are choices made here. Everything else is either a key Dependabot
# requires, or a default left alone deliberately and said to be one.

version: 2

updates:
  # ---------------------------------------------------------------------------------
  # npm — the pnpm workspace
  # ---------------------------------------------------------------------------------
  - package-ecosystem: "npm"
    # DECISION: one entry at the workspace root, not one entry per package. kobai is a
    # pnpm workspace (`pnpm-workspace.yaml`: `packages/*`, `reference`) resolved into a
    # single root `pnpm-lock.yaml`. Dependabot's npm fetcher reads `pnpm-workspace.yaml`
    # from this directory, expands those globs against the repository, and fetches each
    # member manifest itself — so `packages/core/package.json`,
    # `packages/plugin-price-log/package.json` and `reference/package.json` are all in
    # scope from here. Listing them separately would run overlapping jobs over the one
    # lockfile they share.
    directory: "/"

    schedule:
      # DECISION: weekly, not daily. A merged bump rewrites `pnpm-lock.yaml`, and every
      # open branch then has to rebase onto it. Work here lands from several branches
      # at once, so one predictable batch a week costs far less churn than a daily
      # trickle — and a week of drift is not the failure this repository actually had.
      interval: "weekly"
      day: "monday"
      # `time` and `timezone` are left at their defaults — a time Dependabot picks, in
      # UTC. The day is what matters here; the hour is not worth a decision.

    # DECISION: raised from the default of 5. The routine batch below is one PR, but each
    # outstanding major gets its own (see `groups`) — at the default limit, a backlog of
    # majors is exactly what gets crowded out, which is the drift #28 found.
    open-pull-requests-limit: 10

    groups:
      # DECISION: one PR for everything routine. Minor and patch across every workspace
      # package, runtime and development alike, so an ordinary week is one branch, one CI
      # run and one review rather than a PR per package.
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # DECISION: majors are deliberately left out of every group. A dependency matching no
    # group falls back to its own pull request, so `typescript` 5 → 7 arrives alone, on
    # its own branch, titled with the package and the boundary it crosses, with its own
    # CI run. Folding majors into the routine batch would recreate the failure: one PR
    # nobody reads to the bottom of, going red for a reason that is not obvious, and
    # sitting. A major is meant to cost a decision — this makes it visibly ask for one.

    # DECISION: `@types/node` never crosses a major here. #28 records why: `devbox.json`
    # pins `nodejs@22` under ADR-0031, and typing against Node 26's API surface while
    # running Node 22 typechecks code against functions that do not exist at runtime —
    # worse than being behind. Without this, a 22 → 26 PR would arrive every week and be
    # hand-closed every week, which is how a reviewer learns to skim past exactly the
    # kind of PR this file exists to make them read. **Lift this the day the devbox Node
    # pin moves** — that pin is the constraint, not the types.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # DECISION: `openapi-typescript` never crosses a major here either, and the reason is
      # the same shape as `@types/node`'s — a pin elsewhere in the repository is the real
      # constraint. Version 7 emits its TypeScript through the **compiler API**, and
      # TypeScript 7 ships none: the import resolves to `undefined` and it dies on
      # `ts.factory` before it reads a byte of `openapi.json`
      # (openapi-ts/openapi-typescript#2841, open; `@hey-api/openapi-ts` fails the same way
      # in hey-api/hey-api#4235). Version 6 emits text and needs no compiler at all, which
      # is why `@kobai/client` pins it exactly. A weekly 6 → 7 PR would be red every week
      # and hand-closed every week. **Lift this the day TypeScript ships an API again and
      # the generator uses it** — expected in 7.1, and a different API, so treat it as a
      # decision rather than a bump. See AGENTS.md § "There is no TypeScript compiler API".
      - dependency-name: "openapi-typescript"
        update-types: ["version-update:semver-major"]

    cooldown:
      # DECISION: hold a release briefly before proposing it, so a version yanked or
      # hot-fixed within days never becomes a PR at all. Security updates ignore cooldown
      # entirely, which is the point of putting the delay here rather than in the
      # schedule.
      #
      # Deliberately flat: no `semver-major-days`. A longer hold on majors is the obvious
      # thing to reach for and it is wrong here — stacked on a Monday-only window it can
      # push a major out by nearly a fortnight, and #29 exists because a major went
      # unnoticed. The update that most needs to surface does not get extra latency. A
      # minor takes `default-days`; `semver-minor-days` is omitted because it would only
      # restate it.
      default-days: 3
      semver-patch-days: 0

    commit-message:
      # DECISION: kobai writes Conventional Commits, and Dependabot otherwise infers the
      # convention from history — #15 happened to infer it correctly, which is luck
      # rather than a guarantee. Stated instead: `chore(deps): …` for runtime
      # dependencies, `chore(deps-dev): …` for development ones.
      prefix: "chore"
      include: "scope"

    # `labels` is left at the default (`dependencies`, plus the ecosystem's own). Marking
    # majors with a custom label was considered and rejected: Dependabot only applies a
    # custom label that already exists in the repository and silently drops one that does
    # not, so the label would have to be created out-of-band in repository settings to do
    # anything — a guarantee this file cannot make on its own. The separate pull request
    # above carries the same signal and is entirely checked in.

  # ---------------------------------------------------------------------------------
  # GitHub Actions — the CI file
  # ---------------------------------------------------------------------------------
  # Nothing watches these today, and a pinned action drifts exactly the way an npm
  # dependency does: `actions/checkout@v4` stays on v4 forever until something asks.
  # ("Workflow" is avoided throughout: CONTEXT.md reserves it for a declared commerce
  # process, and `tests/no-push-script.test.ts` draws the same distinction.)
  - package-ecosystem: "github-actions"
    # Required, and `/` is the only sensible value: for this ecosystem Dependabot reads
    # `.github/workflows/` relative to here, not one directory per file in it.
    directory: "/"

    schedule:
      # Same weekly cadence as npm, for the same reason.
      interval: "weekly"
      day: "monday"

    # `open-pull-requests-limit` is left at the default of 5 here, unlike npm above, and
    # the difference is deliberate rather than an oversight: `.github/workflows/` pins
    # three actions in total, so every one of them can go major in the same week and
    # still fit. Raise it if the number of pinned actions ever passes five.

    groups:
      # DECISION: same shape as npm. Routine action bumps batch into one PR; a major —
      # `actions/checkout@v4` → `@v5` — is left ungrouped and arrives on its own.
      #
      # Note that `jetify-com/devbox-install-action` is on a 0.x version, where a
      # breaking change is a minor by semver and so lands in this batch. That is
      # tolerable here and nowhere else: the gate runs on the pull request that proposes
      # it, so a devbox action that breaks the toolchain install fails its own PR.
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    commit-message:
      # DECISION: `ci`, not `chore` — what changes here is the build, not a dependency
      # of the product.
      prefix: "ci"

    # No `cooldown` here, and the asymmetry with npm is deliberate. Cooldown buys time
    # for a bad release to be yanked before it reaches a PR; an action tag is republished
    # rather than yanked, and the gate itself runs on the PR that proposes the bump, so
    # the soak buys nothing an action bump does not already get for free.

# This Project and its Admin. Two packages, because the Admin is vendored source you own
# and edit rather than a dependency you install (ADR-0033) — and it has its own build, its
# own toolchain and its own `package.json` because it is a browser bundle and this is not.
#
# Recursive commands therefore need `--include-workspace-root`, and its absence is a quiet
# failure rather than a loud one: this Project is the *root* of this workspace, and `pnpm -r`
# skips the root. `pnpm -r build` builds the Admin, reports success, and leaves the Project's
# own TypeScript uncompiled — the first sign being `dist/src/server.js` not existing. The
# Dockerfile and every `devbox run` script pass the flag for that reason.
packages:
  - .
  - admin

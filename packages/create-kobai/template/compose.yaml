# This Project, as a Developer runs it: `pnpm run up` (or `docker compose up`).
#
# Two services and nothing else — Postgres and the application. A first run must not be an
# infrastructure exercise, so there is no cache, no proxy and no separate migration job:
# Core applies its own migrations at boot (see `src/server.ts`).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kobai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobai}
      POSTGRES_DB: ${POSTGRES_DB:-kobai}
    ports:
      # Deliberately not 5432 — the Postgres you may already be running should not have to
      # move. Change it in `.env` if this one is taken too.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # **`/var/lib/postgresql`, not `/var/lib/postgresql/data`** — and the difference is not
      # cosmetic. Postgres 18's image moved `PGDATA` to a major-version-specific
      # `/var/lib/postgresql/18/docker` and declares its `VOLUME` at the parent
      # (docker-library/postgres#1259), so a mount on the old path holds nothing: Docker
      # would satisfy the image's declared volume with an **anonymous** one, the database
      # would live there, and a named volume that looks like the database would be empty.
      # That failure is silent and it is data loss, which is the reason this line is not
      # simply the one that worked under 17.
      #
      # Mounting the parent is also what makes `pg_upgrade --link` possible later, since
      # both major directories then sit inside one mount rather than across a boundary.
      - kobai-db:/var/lib/postgresql
    healthcheck:
      # Over TCP, and that `-h` is the whole of #80. `pg_isready` with no host dials the
      # **unix socket**, and this image initialises a fresh volume by starting a temporary
      # server on that socket with `listen_addresses=''`, running its init scripts, shutting
      # it down and starting the real one. So a socket probe answers "accepting connections"
      # while nothing is listening on TCP at all — compose called `db` healthy, released
      # `app` against a server about to be restarted, and the boot died on
      # `CREATE SCHEMA IF NOT EXISTS "drizzle"`. Naming a host asks the question `app`
      # actually has: is Postgres listening where I am about to dial?
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kobai} -d ${POSTGRES_DB:-kobai}",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      # Failures before this do not count against `retries`, so a first boot on a loaded
      # machine is given room to finish `initdb` instead of being declared unhealthy while
      # it is still working. It is not a delay: a success inside the period is taken at once.
      start_period: 60s

  app:
    build:
      # This Project's own directory. kobai is an ordinary dependency installed from a
      # registry, so there is nothing outside this folder to build from.
      context: .
      dockerfile: Dockerfile
    # A list rather than a map, and that is load-bearing for the last two entries. Compose
    # forwards no variable a service does not name, and the two forms differ in what they do
    # when one is unset: `KOBAI_…: ${KOBAI_…}` sets it to an empty string (and warns every
    # time this file is parsed), while a bare name sets it *not at all*. The second is what
    # kobai is owed — "nobody configured a Merchant" is an answer it reports, not a blank one
    # it has to interpret. Both forms read `.env` as well as the shell, which is where
    # `.env.example` sends you. A map cannot hold a bare name, so the whole block is a list.
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-kobai}:${POSTGRES_PASSWORD:-kobai}@db:5432/${POSTGRES_DB:-kobai}
      - PORT=3000
      # Who this deployment's first Merchant is — the account you sign in to the Admin with,
      # created on the first boot that finds none. Passed through with no default on purpose:
      # a value written here would be a password every deployment that never read this line
      # shared. Unset, the application still boots and serves, and says in its log that
      # nobody can administer it. Set both in `.env`; see `.env.example`.
      - KOBAI_INITIAL_MERCHANT_EMAIL
      - KOBAI_INITIAL_MERCHANT_PASSWORD
      # What this deployment takes payments a Shopper completes at their bank with, and the
      # key its own routes place the resulting Orders with. Bare names for the same reason as
      # the two above: unset has to reach the application as unset, because "this deployment
      # takes no payments at a bank" is an answer it reports rather than a blank it has to
      # interpret. Set them in `.env`; see `.env.example`, which is the whole list.
      - KOBAI_STORE_API_KEY
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PAYMENT_PAGE_URL
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # This Store's images, and everything else a Merchant uploads. The storage kobai ships
      # — what a Project that configures no `media` storage gets — writes them to
      # `kobai-media/` beside the application *inside* the container, and a container's own
      # filesystem goes away with the container. Without this line every image in this
      # catalog is gone the next time you rebuild and bring this up, and nothing tells you
      # until a page renders without them.
      #
      # A named volume rather than a bind mount, for the same reason `kobai-db` is one. The
      # application runs as an unprivileged user inside the container, and Docker populates a
      # fresh named volume from the image's own directory, ownership included — whereas a
      # host directory Docker has to create arrives owned by root, and the first upload is
      # refused. It also keeps the bytes off whatever filesystem this Project happens to be
      # checked out on. `docker compose down` keeps them; `docker compose down --volumes`
      # deletes them, along with the database.
      #
      # Point `media` at an object store in `kobai.config.ts` and no bytes come here at all:
      # this volume is then holding nothing, and can go.
      - kobai-media:/app/kobai-media
    depends_on:
      db:
        condition: service_healthy

volumes:
  kobai-db:
  kobai-media:

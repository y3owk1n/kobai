# This Project and its Admin. Two packages, because the Admin is vendored source you own
# and edit rather than a dependency you install (ADR-0033) — and it has its own build, its
# own toolchain and its own `package.json` because it is a browser bundle and this is not.
#
# **`pnpm -r` skips the workspace root, and this Project *is* the root.** So a recursive
# command builds the Admin, reports success, and leaves this Project's own TypeScript
# uncompiled — the first sign being `dist/src/server.js` not existing. That is a quiet
# failure rather than a loud one, so nothing here relies on remembering a flag: the `build`
# and `typecheck` scripts in `package.json` name both halves outright, and the Dockerfile
# runs `pnpm run build` rather than a second definition of its own.
packages:
  - .
  - admin

# pnpm 11 runs no dependency's install script unless it is named here, which is a good
# default — an install script is arbitrary code from the registry running on your machine.
# esbuild is the one exception this Project needs, and it is not optional: the published
# package is a stub whose `postinstall` fetches the platform binary, so without this entry
# `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS and the Admin cannot build at all.
#
# It is yours to extend. A dependency you add that wants to run a script will fail the
# install by name until you decide about it, which is the point.
allowBuilds:
  esbuild: true

# The reference Project, as a Developer runs it: `devbox run up` (or `docker compose up`).
#
# Two services and nothing else — Postgres and the application. A first run must not be an
# infrastructure exercise, so there is no cache, no proxy, and no separate migration job:
# Core applies its own migrations at boot (see `reference/src/server.ts`).
#
# The `db` service is also what the test suite runs against. Tests need a real Postgres
# because, under ADR-0004/0011/0030, the schema and its migrations *are* part of the
# product — a fake would skip the thing most likely to break. `devbox run db` brings up
# just this service.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kobai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobai}
      POSTGRES_DB: ${POSTGRES_DB:-kobai}
    ports:
      # Deliberately not 5432 — a Developer's own Postgres should not have to move. And
      # deliberately not a fixed port either: devbox derives POSTGRES_PORT from the
      # checkout's path, and the address the test harness dials from the same value, so
      # two checkouts can run the gate at once and cannot disagree about where the
      # database is. See AGENTS.md § Development. The literal below is what a bare
      # `docker compose` outside devbox falls back to, and the test harness falls back to
      # the same one.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - kobai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kobai} -d ${POSTGRES_DB:-kobai}"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build:
      # The monorepo root: the reference Project depends on @kobai/core from this workspace.
      context: .
      dockerfile: Dockerfile
    # A list rather than a map, and that is load-bearing for the last two entries. Compose
    # forwards no variable a service does not name, and the two forms differ in what they do
    # when one is unset: `KOBAI_…: ${KOBAI_…}` sets it to an empty string (and warns, on every
    # `docker compose` this file is parsed by, `devbox run db` included), while a bare name
    # sets it *not at all*. The second is what Core is owed — "nobody configured a Merchant"
    # is an answer it reports (`not-configured`), not a blank one it has to interpret. Both
    # forms read `.env` as well as the shell, which is where `.env.example` sends a Developer.
    # A map cannot hold a bare name, so the whole block is a list. YAML allows no mixing.
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-kobai}:${POSTGRES_PASSWORD:-kobai}@db:5432/${POSTGRES_DB:-kobai}
      # Inside the container, and deliberately a literal. The container has a network
      # namespace to itself, so there is nothing in there to collide with — only the host
      # side, below, has to belong to this checkout.
      - PORT=3000
      # Who this deployment's first Merchant is (ADR-0041). Passed through with no default
      # on purpose: a value written here would be a credential every checkout that never
      # read this line shared, which is the failure seeding replaced wearing a different
      # hat. Unset, the application boots, serves, and says in its log that it has no
      # Merchant. See `.env.example`.
      - KOBAI_INITIAL_MERCHANT_EMAIL
      - KOBAI_INITIAL_MERCHANT_PASSWORD
    ports:
      # Derived, for the same reason the database's port above is: devbox hashes the
      # checkout's path into a port in 53000-53999, so two checkouts can run
      # `devbox run up` at once with nothing passed by hand, and `devbox run up` prints the
      # URL it lands on. See AGENTS.md § Development. The literal below is what a bare
      # `docker compose` outside devbox falls back to.
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kobai-db:

# The reference Project, as a Developer runs it: `pnpm run up` (or `docker compose up`).
#
# Two services and nothing else — Postgres and the application. A first run must not be an
# infrastructure exercise, so there is no cache, no proxy, and no separate migration job:
# Core applies its own migrations at boot (see `reference/src/server.ts`).
#
# The `db` service is also what the test suite runs against. Tests need a real Postgres
# because, under ADR-0004/0011/0030, the schema and its migrations *are* part of the
# product — a fake would skip the thing most likely to break. `pnpm run db` brings up
# just this service.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kobai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kobai}
      POSTGRES_DB: ${POSTGRES_DB:-kobai}
    ports:
      # Deliberately not 5432 — a Developer's own Postgres should not have to move. The
      # literal below is what an ordinary checkout publishes on, and the test harness falls
      # back to the same one; `tests/the-fallback-postgres-port.test.ts` holds the copies to
      # one number. A git worktree overrides it from its own `.env`, which this file reads
      # like any other value, so the container and the suite cannot disagree about where the
      # database is. See AGENTS.md § The ports belong to the checkout.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      # **`/var/lib/postgresql`, not `/var/lib/postgresql/data`** — and the difference is not
      # cosmetic. Postgres 18's image moved `PGDATA` to a major-version-specific
      # `/var/lib/postgresql/18/docker` and declares its `VOLUME` at the parent
      # (docker-library/postgres#1259), so a mount on the old path holds nothing: Docker
      # would satisfy the image's declared volume with an **anonymous** one, the database
      # would live there, and a named volume that looks like the database would be empty.
      # That failure is silent and it is data loss, which is the reason this line is not
      # simply the one that worked under 17.
      #
      # Mounting the parent is also what makes `pg_upgrade --link` possible later, since
      # both major directories then sit inside one mount rather than across a boundary.
      - kobai-db:/var/lib/postgresql
    healthcheck:
      # Over TCP, and that `-h` is the whole of #80. `pg_isready` with no host dials the
      # **unix socket**, and this image initialises a fresh volume by starting a temporary
      # server on that socket with `listen_addresses=''`, running its init scripts, shutting
      # it down and starting the real one. So a socket probe answers "accepting connections"
      # while nothing is listening on TCP at all — and every caller of `docker compose up
      # --wait db` (the gate among them) was released against a server about to be
      # restarted. Naming a host asks the question a client actually has: is Postgres
      # listening where I am about to dial? See ADR-0048.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-kobai} -d ${POSTGRES_DB:-kobai}",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      # Failures before this do not count against `retries`, so a first boot on a loaded
      # machine is given room to finish `initdb` instead of being declared unhealthy while
      # it is still working. It is not a delay: a success inside the period is taken at once.
      start_period: 60s

  app:
    build:
      # The monorepo root: the reference Project depends on @kobai/core from this workspace.
      context: .
      dockerfile: Dockerfile
    # A list rather than a map, and that is load-bearing for the last two entries. Compose
    # forwards no variable a service does not name, and the two forms differ in what they do
    # when one is unset: `KOBAI_…: ${KOBAI_…}` sets it to an empty string (and warns, on every
    # `docker compose` this file is parsed by, `pnpm run db` included), while a bare name
    # sets it *not at all*. The second is what Core is owed — "nobody configured a Merchant"
    # is an answer it reports (`not-configured`), not a blank one it has to interpret. Both
    # forms read `.env` as well as the shell, which is where `.env.example` sends a Developer.
    # A map cannot hold a bare name, so the whole block is a list. YAML allows no mixing.
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-kobai}:${POSTGRES_PASSWORD:-kobai}@db:5432/${POSTGRES_DB:-kobai}
      # Inside the container, and deliberately a literal. The container has a network
      # namespace to itself, so there is nothing in there to collide with — only the host
      # side, below, has to belong to this checkout.
      - PORT=3000
      # Who this deployment's first Merchant is (ADR-0041). Passed through with no default
      # on purpose: a value written here would be a credential every checkout that never
      # read this line shared, which is the failure seeding replaced wearing a different
      # hat. Unset, the application boots, serves, and says in its log that it has no
      # Merchant. See `.env.example`.
      - KOBAI_INITIAL_MERCHANT_EMAIL
      - KOBAI_INITIAL_MERCHANT_PASSWORD
      # What this checkout takes payments a Shopper completes at their bank with, and the key
      # its own routes place the resulting Orders with (ADR-0070). Bare names for the same
      # reason as the two above, and unset in every checkout that has not deliberately filled
      # them in — including CI, which must never hold a Stripe secret. See `.env.example`.
      - KOBAI_STORE_API_KEY
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PAYMENT_PAGE_URL
    ports:
      # 3000 unless `.env` says otherwise, which is how a git worktree gets a port of its
      # own: `scripts/ensure-env.ts` writes one in 53000-53999 into that worktree's `.env`,
      # this file reads it, and `pnpm run up` prints the URL it lands on. See AGENTS.md
      # § The ports belong to the checkout.
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kobai-db:
